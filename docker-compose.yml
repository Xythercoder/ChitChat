version: '3.8'

services:
  webserver:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "8706:5001"
    networks:
      - app-network
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    depends_on:
      - server
    networks:
      - app-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

 server:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "8090:80"   # Expose port 8090
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
